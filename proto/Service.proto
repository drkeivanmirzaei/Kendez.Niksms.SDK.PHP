message GrpcWebServiceSendSmsSingleRequest{
	string ApiKey = 1;
	string SenderNumber = 2;
	optional google.protobuf.Timestamp SendDate = 3;
	string Phone = 4;
	string MessageId = 5;
	string Message = 6;
	GrpcOperatorSmsSendType SendType = 7;
	string ServiceType = 8;
	GrpcApiType ApiType = 9;
	bool Debug = 10;
	int32 Priority = 11;
}

message GrpcWebServiceSendSmsSingleResponse{
	GrpcWebServiceSendSmsResult Result = 1;
}

message GrpcWebServiceSendSmsGroupRequest{
	string ApiKey = 1;
	string Message = 2;
	string SenderNumber = 3;
	optional google.protobuf.Timestamp SendDate = 4;
	repeated GrpcWebServiceGroupSmsRecipient Recipients = 5;
	GrpcOperatorSmsSendType SendType = 6;
	string ServiceType = 7;
	GrpcApiType ApiType = 8;
	bool Debug = 9;
	int32 Priority = 10;
}

message GrpcWebServiceSendSmsGroupResponse{
	GrpcWebServiceSendSmsResult Result = 1;
}

message GrpcWebServiceSendSmsPtpRequest{
	string ApiKey = 1;
	string SenderNumber = 2;
	optional google.protobuf.Timestamp SendDate = 3;
	repeated GrpcWebServicePtpSmsRecipient Recipients = 4;
	GrpcOperatorSmsSendType SendType = 5;
	string ServiceType = 6;
	GrpcApiType ApiType = 7;
	bool Debug = 8;
	int32 Priority = 9;
}

message GrpcWebServiceSendSmsPtpResponse{
	GrpcWebServiceSendSmsResult Result = 1;
}

message GrpcWebServiceSendSmsOtpRequest{
	string ApiKey = 1;
	string SenderNumber = 2;
	optional google.protobuf.Timestamp SendDate = 3;
	string Phone = 4;
	string MessageId = 5;
	string Message = 6;
	GrpcOperatorSmsSendType SendType = 7;
	string ServiceType = 8;
	GrpcApiType ApiType = 9;
	bool Debug = 10;
	int32 Priority = 11;
}

message GrpcWebServiceSendSmsOtpResponse{
	GrpcWebServiceSendSmsResult Result = 1;
}

message GrpcWebServiceGetCreditRequest{
	string ApiKey = 1;
	string ServiceType = 2;
	GrpcApiType ApiType = 3;
	bool Debug = 4;
}

message GrpcWebServiceGetCreditResponse{
	double Balance = 1;
	GrpcCurrencyType Currency = 2;
}

message GrpcWebServiceGetPanelExpireDateRequest{
	string ApiKey = 1;
	string ServiceType = 2;
	GrpcApiType ApiType = 3;
	bool Debug = 4;
}

message GrpcWebServiceGetPanelExpireDateResponse{
	google.protobuf.Timestamp ExpiresAt = 1;
}

message GrpcWebServiceGetSmsStatusRequest{
	string ApiKey = 1;
	repeated string MessageIds = 2;
	string ServiceType = 3;
	GrpcApiType ApiType = 4;
	bool Debug = 5;
}

message GrpcWebServiceGetSmsStatusResponse{
	repeated GrpcWebServiceSmsStatusResult Result = 1;
}

message GrpcWebServiceSendSmsResult{
	GrpcMessageStatus Status = 1;
	string Message = 2;
	string OperationId = 3;
	repeated string MessageIds = 4;
}

message GrpcWebServiceGroupSmsRecipient{
	string Phone = 1;
	string MessageId = 2;
}

message GrpcWebServicePtpSmsRecipient{
	string Message = 1;
	string Phone = 2;
	string MessageId = 3;
}

message GrpcWebServiceSmsStatusResult{
	string MessageId = 1;
	GrpcSmsStatus Status = 2;
}


/*---------- Predefined Messages ----------*/
message GrpcDynamicObjectMessage{
	string Value = 1;
	string ValueType = 2;
}
/*---------- Enums ----------*/
enum GrpcOperationResultType{
	OperationResultType_Pending = 0;
	OperationResultType_UnAuthorized = 1;
	OperationResultType_Failed = 2;
	OperationResultType_Success = 3;
	OperationResultType_NotFound = 4;
	OperationResultType_Rejected = 5;
	OperationResultType_Duplicate = 6;
	OperationResultType_Validation = 7;
	OperationResultType_BotUserNotFound = 8;
	OperationResultType_Conflict = 9;
	OperationResultType_NotAcceptable = 10;
	OperationResultType_SecurityIssue = 11;
	OperationResultType_UnsupportedMediaType = 12;
	OperationResultType_UnKnown = 255;
}
enum GrpcOperatorSmsSendType{
	 OperatorSmsSendType_Unknown = 0;
	OperatorSmsSendType_Normal = 1;
	OperatorSmsSendType_Flash = 2;
	OperatorSmsSendType_AudioMessageMinute = 3;
	OperatorSmsSendType_AudioMessageSecod = 4;
}
enum GrpcApiType{
	 ApiType_Unknown = 0;
	ApiType_Normal = 1;
	ApiType_OTP = 2;
}
enum GrpcCurrencyType{
	CurrencyType_UnKnown = 0;
	CurrencyType_Rial = 1;
	CurrencyType_Dirham = 2;
	CurrencyType_USD = 3;
	CurrencyType_EUR = 4;
}
