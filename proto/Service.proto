syntax = "proto3";
package WebService;
option csharp_namespace = "Kendez.NikSms.WebService.GrpcClient";

/*---------- Imports ----------*/
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/any.proto";

/*---------- Services ----------*/
service GrpcWebService{
	rpc SendSingle(GrpcWebService_SendSingleReq) returns(GrpcKendez_Common_Abstraction_Types_Base_OperationResult_Kendez_NikSms_WebService_Abstraction_Models_WebServiceSendSmsSingleResponse_);
	rpc SendGroup(GrpcWebService_SendGroupReq) returns(GrpcKendez_Common_Abstraction_Types_Base_OperationResult_Kendez_NikSms_WebService_Abstraction_Models_WebServiceSendSmsGroupResponse_);
	rpc SendPtp(GrpcWebService_SendPtpReq) returns(GrpcKendez_Common_Abstraction_Types_Base_OperationResult_Kendez_NikSms_WebService_Abstraction_Models_WebServiceSendSmsPtpResponse_);
	rpc SendOtp(GrpcWebService_SendOtpReq) returns(GrpcKendez_Common_Abstraction_Types_Base_OperationResult_Kendez_NikSms_WebService_Abstraction_Models_WebServiceSendSmsOtpResponse_);
	rpc GetCredit(GrpcWebService_GetCreditReq) returns(GrpcKendez_Common_Abstraction_Types_Base_OperationResult_Kendez_NikSms_WebService_Abstraction_Models_WebServiceGetCreditResponse_);
	rpc GetPanelExpireDate(GrpcWebService_GetPanelExpireDateReq) returns(GrpcKendez_Common_Abstraction_Types_Base_OperationResult_Kendez_NikSms_WebService_Abstraction_Models_WebServiceGetPanelExpireDateResponse_);
	rpc SmsStatus(GrpcWebService_SmsStatusReq) returns(GrpcKendez_Common_Abstraction_Types_Base_OperationResult_Kendez_NikSms_WebService_Abstraction_Models_WebServiceGetSmsStatusResponse_);
}

/*---------- Messages ----------*/
