	MessageStatus_PrivateNumberIsDisable = 7;
	MessageStatus_ArgumentIsNullOrIncorrect = 8;
	MessageStatus_MessageBodyIsNullOrEmpty = 9;
	MessageStatus_PrivateNumberIsIncorrect = 10;
	MessageStatus_ReceptionNumberIsIncorrect = 11;
	MessageStatus_SentTypeIsIncorrect = 12;
	MessageStatus_Warning = 13;
	MessageStatus_PanelIsBlocked = 14;
	MessageStatus_SiteUpdating = 15;
	MessageStatus_AudioMessageNotAllowed = 16;
	MessageStatus_AudioMessageFileSizeNotAllowed = 17;
	MessageStatus_PanelExpired = 18;
	MessageStatus_InvalidUserNameOrPass = 19;
	MessageStatus_UserIsWaitForApprove = 20;
	MessageStatus_UserApiBlocked = 21;
	MessageStatus_CheckedByAi = 22;
	MessageStatus_HavePendingFilter = 23;
}
