	SmsStatus_Block = 6;
	SmsStatus_NotDeliverdCanceled = 8;
	SmsStatus_NotDeliverdSmsAdvertisingBlock = 9;
	SmsStatus_NotDeliverdBlackList = 10;
	SmsStatus_NotDeliverdDelay = 11;
	SmsStatus_NotDeliverdNoViber = 13;
	SmsStatus_NotDeliverdFiltering = 14;
	SmsStatus_WaitingForRecheckInOprator = 15;
	SmsStatus_OpratorFault = 16;
	SmsStatus_NotDeliveredBlocked = 17;
	SmsStatus_SendedButStatusNotUpdated = 18;
	SmsStatus_NotDeliveredDuplicate = 19;
	SmsStatus_NotDeliveredBlockPanel = 20;
	SmsStatus_NotDeliveredUnknownNumber = 21;
	SmsStatus_WaitingForDeliveryBeforeSend = 22;
	SmsStatus_NotDeliveredUnAccessible = 23;
	SmsStatus_NotDeliveredNotAnswered = 24;
	SmsStatus_NotDeliveredLineIsBusy = 25;
	SmsStatus_NotDeliverTCTFiltering = 26;
